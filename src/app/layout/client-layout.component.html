<div class="client-shell">
  <nav class="navbar navbar-expand-lg topbar sticky-top">
    <div class="container-fluid px-3 px-md-4 nav-wrap">
      <a class="navbar-brand" routerLink="/home" (click)="closeMenu()">
        <div>{{profile?.company ||  'Client User'}}</div>
        <small>build {{buildTime}}</small>
      </a>

      <button type="button" class="navbar-toggler" aria-label="Toggle navigation"
        [attr.aria-expanded]="isMenuOpen" (click)="toggleMenu()">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="nav-collapse" [class.show]="isMenuOpen">
        <ul class="navbar-nav nav-tabs-client">
          <li class="nav-item">
            <a class="nav-link" routerLink="/home" [class.active]="isSectionActive('home')"
              [attr.aria-current]="isSectionActive('home') ? 'page' : null" (click)="closeMenu()">
              Home
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/projects" [class.active]="isSectionActive('projects')"
              [attr.aria-current]="isSectionActive('projects') ? 'page' : null" (click)="closeMenu()">
              Projects
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/cases" [class.active]="isSectionActive('cases')"
              [attr.aria-current]="isSectionActive('cases') ? 'page' : null" (click)="closeMenu()">
              Cases
            </a>
          </li>
           <li class="nav-item">
            <a class="nav-link" routerLink="/cr" [class.active]="isSectionActive('cr')"
              [attr.aria-current]="isSectionActive('cr') ? 'page' : null" (click)="closeMenu()">
              Changes Request
            </a>
          </li>
        </ul>

        <div class="d-flex align-items-center gap-3 user-actions">
          <a class="user-pill" routerLink="/profile" *ngIf="(user$ | async) as user" (click)="closeMenu()">{{ user?.name || user?.email || 'Client User' }}</a>
          <button class="btn btn-outline-light btn-sm" (click)="logout()">Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <main class="container-fluid px-3 px-md-4 py-4">
    <router-outlet></router-outlet>
  </main>
</div>
